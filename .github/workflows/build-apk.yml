name: Build debug APK

on:
  push:
    branches: [feature/native-kotlin-app]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Backend URL the app talks to (must end with /)
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Point the app at the backend
        working-directory: pulse-android
        env:
          API: ${{ inputs.api_base_url || vars.API_BASE_URL || 'https://130-210-39-184.sslip.io/' }}
        run: echo "API_BASE_URL=$API" > local.properties

      - name: Build
        working-directory: pulse-android
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            grep -E '^e: |error:|What went wrong|Execution failed|Could not |FAILED|Unresolved|Duplicate' build.log | head -30 | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error title=build::${line:0:400}"; done
          fi
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: pulse-debug-apk
          path: pulse-android/app/build/outputs/apk/debug/*.apk

      - name: Publish APK as a download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp pulse-android/app/build/outputs/apk/debug/app-debug.apk Pulse-Music-debug.apk
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest Pulse-Music-debug.apk --prerelease --target "$GITHUB_SHA" --title "Pulse Music debug build" --notes "Debug build of the native app. Built from the feature/native-kotlin-app branch." 

